<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Layer visual adjustment demonstration: brightness, contrast, saturation and opacity controls applied to a PCB scan layer" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Consolas,monospace">
  <rect width="800" height="500" fill="#F0EDE4"/>
  <rect x="0" y="0" width="800" height="34" fill="#E8E4D8"/>
  <line x1="0" y1="34" x2="800" y2="34" stroke="#14171A"/>
  <text x="18" y="22" fill="#14171A" font-size="13" letter-spacing="1.4" font-weight="700">PCBSPY</text>
  <text x="110" y="22" fill="#8B8E8A" font-size="10" letter-spacing="1">LAYER ADJUSTMENTS</text>

  <!-- Board (enhanced right / original left) -->
  <rect x="34" y="60" width="470" height="400" fill="#3a5a42" stroke="#14171A"/>
  <g fill="#ffd166" opacity="0.9">
    <rect x="74" y="100" width="120" height="14"/>
    <rect x="74" y="124" width="90" height="14"/>
  </g>
  <rect x="294" y="110" width="160" height="90" fill="#12241a" stroke="#3ddc84"/>
  <g stroke="#c9a227" stroke-width="3" fill="none" opacity="0.8">
    <path d="M94 250 H 294 V 330 H 454"/>
    <path d="M114 290 H 254 V 400"/>
  </g>
  <g fill="#e8c15a" stroke="#14171A"><circle cx="94" cy="250" r="6"/><circle cx="454" cy="330" r="6"/><circle cx="254" cy="400" r="6"/></g>
  <!-- before/after split -->
  <rect x="34" y="60" width="235" height="400" fill="#000" opacity="0.3"/>
  <line x1="269" y1="60" x2="269" y2="460" stroke="#F0EDE4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="52" y="448" fill="#D9D3C4" font-size="10" letter-spacing="1">ORIGINAL</text>
  <text x="404" y="448" fill="#F0EDE4" font-size="10" letter-spacing="1">ENHANCED</text>

  <!-- Adjustments panel -->
  <rect x="536" y="60" width="234" height="400" fill="#F0EDE4" stroke="#14171A"/>
  <text x="552" y="86" fill="#14171A" font-size="12" letter-spacing="1.2" font-weight="700">ADJUSTMENTS — TOP</text>
  <line x1="552" y1="94" x2="754" y2="94" stroke="#14171A"/>

  <g font-size="10" fill="#4A4E52" letter-spacing="1">
    <text x="552" y="126">OPACITY</text><text x="552" y="176">BRIGHTNESS</text>
    <text x="552" y="226">CONTRAST</text><text x="552" y="276">SATURATION</text>
    <text x="552" y="326">HUE</text><text x="552" y="376">SHARPEN</text>
  </g>
  <g>
    <g><rect x="552" y="136" width="202" height="3" fill="#8B8E8A"/><rect x="706" y="130" width="12" height="16" fill="#14171A"/></g>
    <g><rect x="552" y="186" width="202" height="3" fill="#8B8E8A"/><rect x="660" y="180" width="12" height="16" fill="#14171A"/></g>
    <g><rect x="552" y="236" width="202" height="3" fill="#8B8E8A"/><rect x="692" y="230" width="12" height="16" fill="#14171A"/></g>
    <g><rect x="552" y="286" width="202" height="3" fill="#8B8E8A"/><rect x="636" y="280" width="12" height="16" fill="#14171A"/></g>
    <g><rect x="552" y="336" width="202" height="3" fill="#8B8E8A"/><rect x="596" y="330" width="12" height="16" fill="#14171A"/></g>
    <g><rect x="552" y="386" width="202" height="3" fill="#8B8E8A"/><rect x="620" y="380" width="12" height="16" fill="#14171A"/></g>
  </g>
  <rect x="552" y="410" width="202" height="26" fill="#F0EDE4" stroke="#E8531B" stroke-width="2"/>
  <text x="653" y="427" fill="#E8531B" font-size="10" letter-spacing="1.2" text-anchor="middle">RESET ADJUSTMENTS</text>
</svg>
