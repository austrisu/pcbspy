<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Annotation and net tracing demonstration: pads, vias and holes wired into electrical nets across a PCB" font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,Consolas,monospace">
  <rect width="800" height="500" fill="#F0EDE4"/>
  <rect x="0" y="0" width="800" height="34" fill="#E8E4D8"/>
  <line x1="0" y1="34" x2="800" y2="34" stroke="#14171A"/>
  <text x="18" y="22" fill="#14171A" font-size="13" letter-spacing="1.4" font-weight="700">PCBSPY</text>
  <text x="110" y="22" fill="#8B8E8A" font-size="10" letter-spacing="1">ANNOTATE &amp; TRACE NETS</text>

  <!-- Board photo -->
  <rect x="34" y="60" width="520" height="400" fill="#3a5a42" stroke="#14171A"/>
  <rect x="64" y="90" width="130" height="90" fill="#2c4a35"/>
  <rect x="354" y="100" width="150" height="70" fill="#2c4a35"/>
  <rect x="84" y="300" width="380" height="110" fill="#2c4a35"/>

  <!-- Net traces -->
  <g stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M114 140 L 254 140 L 254 240 L 424 240" stroke="#E8531B"/>
    <path d="M114 330 L 194 330 L 194 360 L 424 360" stroke="#ff1e1e"/>
    <path d="M294 335 L 294 240 L 114 240 L 114 140" stroke="#E8531B" stroke-opacity="0.3"/>
  </g>

  <!-- Pads (silver squares) -->
  <g fill="#aab2bd" stroke="#14171A" stroke-width="1">
    <rect x="106" y="132" width="16" height="16"/>
    <rect x="416" y="232" width="16" height="16"/>
    <rect x="286" y="327" width="16" height="16"/>
  </g>
  <!-- Vias (green) -->
  <g fill="#3ddc84" stroke="#14171A"><circle cx="254" cy="140" r="8"/><circle cx="254" cy="240" r="8"/></g>
  <!-- Vcc (red) -->
  <g fill="#ff1e1e" stroke="#14171A"><circle cx="114" cy="330" r="8"/><circle cx="424" cy="360" r="8"/></g>
  <!-- Hole (blue) -->
  <circle cx="194" cy="360" r="8" fill="#4a90d9" stroke="#14171A"/>
  <!-- Ground (black) -->
  <circle cx="424" cy="240" r="8" fill="#000" stroke="#888"/>
  <!-- Marker -->
  <g transform="translate(354 96)">
    <rect x="0" y="0" width="40" height="20" fill="#F0EDE4" stroke="#E8531B"/>
    <text x="20" y="14" fill="#E8531B" font-size="11" text-anchor="middle" font-weight="700">U1</text>
  </g>

  <!-- Nets panel -->
  <rect x="586" y="60" width="184" height="400" fill="#F0EDE4" stroke="#14171A"/>
  <text x="602" y="86" fill="#14171A" font-size="12" letter-spacing="1.4" font-weight="700">NETS</text>
  <line x1="602" y1="94" x2="754" y2="94" stroke="#14171A"/>
  <g font-size="11" letter-spacing="0.5">
    <circle cx="610" cy="120" r="6" fill="#E8531B"/><text x="626" y="124" fill="#14171A">SDA · 3</text>
    <circle cx="610" cy="148" r="6" fill="#ff1e1e"/><text x="626" y="152" fill="#14171A">VCC · 2</text>
    <circle cx="610" cy="176" r="6" fill="#3ddc84"/><text x="626" y="180" fill="#14171A">SCL · 4</text>
    <circle cx="610" cy="204" r="6" fill="#000" stroke="#888"/><text x="626" y="208" fill="#4A4E52">GND · 6</text>
  </g>
  <rect x="602" y="228" width="152" height="26" fill="#E8E4D8" stroke="#14171A"/>
  <text x="614" y="245" fill="#4A4E52" font-size="10" letter-spacing="1">＋ NEW NET…</text>
  <line x1="602" y1="278" x2="754" y2="278" stroke="#DAD5C7"/>
  <g fill="#8B8E8A" font-size="9.5">
    <text x="602" y="302">Line tool snaps to dots;</text>
    <text x="602" y="318">through-vias bridge sides.</text>
    <text x="602" y="342">Guard rails block cross-</text>
    <text x="602" y="358">net connections.</text>
  </g>
</svg>
